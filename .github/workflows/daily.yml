name: Daily Codex refresh

on:
  schedule:
    - cron: "0 12 * * *"          # 08:00 ET daily — the steady-state refresh
    - cron: "0 16,18,20,22 * * *"  # 12/2/4/6pm ET — launch-week: auto-catch the PBE→live flip
  workflow_dispatch: {}            # run on demand from the Actions tab
  # The pipeline auto-detects live vs PBE, so the extra afternoon runs simply
  # switch the site to live data the moment Set 18 goes ranked. Trim back to just
  # the 08:00 cron once the meta settles (a few days post-launch).

permissions:
  contents: write   # commit refreshed data back
  pages: write      # publish to GitHub Pages
  id-token: write   # required by deploy-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pull fresh MetaTFT PBE data, rebuild the dataset, and run the QA gate.
      # run_refresh.sh exits non-zero if qa.py finds a blocking issue -> job fails,
      # so a broken build never reaches the live page (yesterday's stays up).
      - name: Refresh data + QA gate
        run: bash run_refresh.sh

      - name: Build page
        run: python build_full.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp set18_explorer.html _site/index.html

      # Persist refreshed data + newly-cached images so tomorrow starts from today.
      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add set18_full.json last_fingerprint.txt
          git commit -m "chore: daily data refresh [skip ci]" || echo "no data change"
          git push || echo "nothing to push"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
