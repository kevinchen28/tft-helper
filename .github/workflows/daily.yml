name: Daily Codex refresh

on:
  schedule:
    - cron: "0 12 * * *"   # 08:00 ET daily — steady-state refresh
  workflow_dispatch: {}    # run on demand from the Actions tab

permissions:
  contents: read    # CI only reads the repo — it never commits back (prevents local divergence)
  pages: write      # publish to GitHub Pages
  id-token: write   # required by deploy-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pull fresh MetaTFT PBE data, rebuild the dataset, and run the QA gate.
      # run_refresh.sh exits non-zero if qa.py finds a blocking issue -> job fails,
      # so a broken build never reaches the live page (yesterday's stays up).
      - name: Refresh data + QA gate
        run: bash run_refresh.sh

      - name: Build Codex page
        run: python build_full.py

      - name: Build opener finder page
        run: |
          python build_openers_data.py
          python build_openers_page.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp "$(python -c 'import config;print(config.HTML)')"    _site/index.html
          cp "$(python -c 'import config;print(config.OPENERS)')" _site/openers.html

      # NOTE: CI intentionally does NOT commit the rebuilt data back to the repo.
      # The committed set{N}_full.json is the image-cache seed; each run reads it,
      # fetches only new/missing images, deploys, and discards the working changes.
      # Keeping main free of bot commits is what stops local merge conflicts.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
